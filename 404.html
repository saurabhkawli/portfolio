<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost in space — Saurabh Kawli</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05060a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2305060a'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ffb26b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; overflow: hidden; text-align: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, #121630 0%, #05060a 65%); color: #ece8e1;
      font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    main { position: relative; z-index: 1; max-width: 640px; }
    .code { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #ffb26b; }
    h1 { margin: 18px 0 0; font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(64px, 12vw, 150px); line-height: 0.92; letter-spacing: -0.02em; }
    h1 em { color: #ffb26b; }
    p { margin: 22px auto 0; max-width: 460px; line-height: 1.6; color: #b4b1bd; }
    .astro { display: block; width: clamp(90px, 14vw, 130px); margin: 0 auto 26px; animation: drift 9s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(-8deg); } 50% { transform: translate(10px, -16px) rotate(10deg); } }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 36px; }
    a, button {
      display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; cursor: pointer;
      font: 13px/1 "JetBrains Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
      color: #ece8e1; background: none; border: 1px solid rgba(236, 232, 225, 0.25); transition: background 0.3s, color 0.3s;
    }
    a:hover, button:hover, a:focus-visible, button:focus-visible { background: #ece8e1; color: #05060a; outline: none; }
    a.primary { background: #ffb26b; border-color: #ffb26b; color: #05060a; }
    a.primary:hover { background: #ece8e1; }
    @media (prefers-reduced-motion: reduce) { .astro { animation: none; } }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main>
    <svg class="astro" viewBox="0 0 120 140" aria-hidden="true">
      <path d="M60 4c-6 0-10 4-10 10" fill="none" stroke="#8b9bff" stroke-width="2" stroke-dasharray="3 4" />
      <rect x="30" y="58" width="60" height="56" rx="20" fill="#e9e6ef" />
      <rect x="42" y="74" width="36" height="16" rx="4" fill="#c9c5d6" />
      <circle cx="50" cy="82" r="3" fill="#ff6b6b" /><circle cx="60" cy="82" r="3" fill="#ffd36b" /><circle cx="70" cy="82" r="3" fill="#6bd1ff" />
      <rect x="16" y="64" width="18" height="38" rx="9" fill="#dcd8e6" /><rect x="86" y="64" width="18" height="38" rx="9" fill="#dcd8e6" />
      <rect x="38" y="108" width="18" height="28" rx="8" fill="#dcd8e6" /><rect x="64" y="108" width="18" height="28" rx="8" fill="#dcd8e6" />
      <circle cx="60" cy="40" r="28" fill="#f2f0f6" />
      <rect x="40" y="26" width="40" height="28" rx="14" fill="#141a33" />
      <path d="M48 34c4-4 10-5 14-4" fill="none" stroke="#8b9bff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    </svg>
    <span class="code">Error 404 · signal lost</span>
    <h1>Lost in <em>space.</em></h1>
    <p>This page drifted out of orbit — or it never existed. Even the best explorers take a wrong turn. Let's get you back to the universe.</p>
    <div class="links">
      <a class="primary" href="/" data-home>Return to the universe →</a>
      <button type="button" onclick="history.length > 1 ? history.back() : (location.href = document.querySelector('[data-home]').href)">Go back</button>
    </div>
  </main>
  <script>
    (function () {
      var home = document.querySelector("[data-home]");
      var seg = location.pathname.split("/")[1];
      if (/\.github\.io$/.test(location.hostname) && seg && seg.indexOf(".") === -1) {
        fetch("/" + seg + "/index.html", { method: "HEAD" }).then(function (r) { if (r.ok) home.href = "/" + seg + "/"; }).catch(function () {});
      }

      var c = document.getElementById("sky"), x = c.getContext("2d"), stars = [], w, h, dpr;
      var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      function size() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
        stars = [];
        for (var i = 0; i < Math.round((innerWidth * innerHeight) / 2600); i++) {
          stars.push({ x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.3 + 0.3) * dpr, s: Math.random() * 0.25 + 0.05, t: Math.random() * 6.28 });
        }
      }
      function frame() {
        x.clearRect(0, 0, w, h);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          if (!still) { s.x -= s.s * dpr; s.t += 0.02; if (s.x < 0) s.x = w; }
          x.globalAlpha = 0.45 + Math.sin(s.t) * 0.35;
          x.fillStyle = "#fff";
          x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill();
        }
        if (!still) requestAnimationFrame(frame);
      }
      size(); frame();
      addEventListener("resize", function () { size(); if (still) frame(); });
    })();
  </script>
</body>
</html>
